{% extends "base.html" %}

{% block content %}

    <span class="eyebrow"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg> Koleksi saya</span>

    <p>Simpan tautan unduhan episode untuk dibuka lagi nanti.</p>
  </div>
</section>
