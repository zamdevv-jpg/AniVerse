{% extends "base.html" %}

{% block content %}
<section class="error-page">
  <div class="error-code">{{ code }}</div>
  <span class="eyebrow"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg> Ada yang tidak beres</span>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <div class="error-actions">
    <a class="btn btn-gold btn-lg" href="/">
      <svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>
      Kembali ke beranda
    </a>
    <a class="btn btn-glass btn-lg" href="/anime">Jelajahi katalog</a>
  </div>
  <div class="error-orbit" aria-hidden="true"></div>
</section>
{% endblock %}
