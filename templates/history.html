{% extends "base.html" %}

{% block content %}
<section class="page-hero">
  <div class="page-hero-copy">
    <span class="eyebrow"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg> Perangkat ini</span>
    <h1>Histori tontonan</h1>
    <p>Lanjutkan anime yang terakhir kamu tonton.</p>
  </div>
  <button class="btn btn-ghost" type="button" id="clear-history"><svg class="icon"><use href="#i-trash"/></svg> Hapus histori</button>
</section>

<section class="section section-first">
  <div class="history-list" id="history-list"></div>
  <div class="empty-state" id="history-empty" hidden>
    <span class="empty-icon"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg></span>
    <h3>Histori masih kosong</h3>
    <p>Episode yang kamu buka akan muncul di sini.</p>
    <a class="btn btn-gold" href="/anime">Jelajahi anime</a>
  </div>
</section>
{% endblock %}
