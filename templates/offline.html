{% extends "base.html" %}

{% block content %}
<section class="profile-head">
  <div class="profile-avatar"><svg class="icon" aria-hidden="true"><use href="#i-device"/></svg></div>
  <div class="profile-copy">
    <span class="eyebrow">Mode perangkat</span>
    <h1>Tersimpan offline</h1>
    <p>Halaman detail yang disimpan tetap bisa dibuka tanpa internet. Video tetap memerlukan koneksi.</p>
  </div>
</section>

<section class="section">
  <div class="poster-grid" id="offline-grid"></div>
  <div class="empty-state" id="offline-empty" hidden>
    <span class="empty-icon"><svg class="icon" aria-hidden="true"><use href="#i-device"/></svg></span>
    <h3>Belum ada anime offline</h3>
    <p>Buka halaman detail anime, lalu pilih “Simpan offline”.</p>
    <a class="btn btn-gold" href="/anime">Jelajahi katalog</a>
  </div>
</section>
{% endblock %}
