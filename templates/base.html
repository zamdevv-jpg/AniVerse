<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ meta_title }}</title>
  <meta name="description" content="{{ meta_description }}">
  <meta name="theme-color" content="#08080b">
  <meta name="color-scheme" content="dark">
  <meta property="og:site_name" content="{{ site_name }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ meta_title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ meta_title }}">
  <meta name="twitter:description" content="{{ meta_description }}">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://i0.wp.com">
  <link rel="preconnect" href="https://i1.wp.com">
  <link rel="preconnect" href="https://i2.wp.com">
  <link rel="preconnect" href="https://i3.wp.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-page="{{ active }}">
  <a class="skip-link" href="#main">Lewati ke konten</a>
  {% include "partials/icons.html" %}
  <div class="app-shell">
    {% include "partials/header.html" %}
    <main id="main" class="site-main container">
      {% block content %}{% endblock %}
    </main>
    {% include "partials/footer.html" %}
  </div>
  {% include "partials/mobile-nav.html" %}
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>
  <noscript>
    <div class="noscript-note">Aktifkan JavaScript untuk pencarian instan, pemilih server, dan bookmark.</div>
  </noscript>
  <script src="/static/js/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
