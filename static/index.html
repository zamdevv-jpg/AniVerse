<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AniVerse</title>
  <style>
    body {
      background: #07070a;
      color: #ffd23f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      gap: 16px;
    }
    .logo {
      width: 112px;
      height: 112px;
      object-fit: contain;
    }
    .loader {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 210, 63, 0.2);
      border-top-color: #ffd23f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img class="logo" src="js/logo.png" alt="AniVerse">
  <div class="loader"></div>
  <div id="status">Memuat AniVerse...</div>
  <script>
    (async function recoverAndroidStartup() {
      const host = window.location.hostname;
      const isTauriShell = window.location.protocol === "tauri:" ||
        window.location.protocol === "file:" || host === "tauri.localhost" ||
        host.endsWith(".localhost");
      if (!isTauriShell || !/Android/i.test(navigator.userAgent)) return;

      const backend = "http://127.0.0.1:3000";
      const deadline = Date.now() + 15000;
      while (Date.now() < deadline) {
        try {
          await fetch(backend + "/healthz", { mode: "no-cors", cache: "no-store" });
          window.location.replace(backend);
          return;
        } catch (_) {
          await new Promise((resolve) => setTimeout(resolve, 500));
        }
      }

      document.querySelector(".loader").hidden = true;
      document.getElementById("status").textContent =
        "AniVerse belum berhasil terhubung. Tutup lalu buka kembali aplikasi.";
    })();
  </script>
</body>
</html>
