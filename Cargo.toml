[package]
name = "otakunime"
version = "0.1.1"
edition = "2024"
description = "AniVerse — katalog anime Sub Indo dari Nimegami, Otakudesu, dan Doronime"
license = "MIT"

[lib]
name = "otakunime"
path = "src/lib.rs"

[[bin]]
name = "otakunime"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-extra = { version = "0.12", features = ["query"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
dotenvy = "0.15"
minijinja = { version = "2", features = ["loader", "json"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "charset",
    "http2",
    "json",
] }
regex = "1"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
